services:
  app:
    image: ${REGISTRY:-localhost}/${SERVICE_NAME:-gateway}:${SERVICE_VERSION:-latest}
    container_name: ${SERVICE_NAME:-gateway}
    restart: always
    environment:
      - SERVICE_ENV=${DEPLOYMENT_ENV:-development}
      - JAVA_OPTS=-Xmx512m -Xms256m
      # Additional environment variables will be loaded from env file
    env_file:
      - ./${SERVICE_NAME:-gateway}.env
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      # - ./config/${DEPLOYMENT_ENV:-development}/${SERVICE_NAME:-gateway}.conf:/app/config/application.conf
      - ./${SERVICE_NAME}.conf:/app/config/application.conf
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_HOST:-redis}
    command: redis-server
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # Keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HTTP_RELATIVE_PATH=/auth
    command:
      - start-dev --http-port 8081
    ports:
      - "8081:8081"
    depends_on:
      - keycloak-db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/auth/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # PostgreSQL for Keycloak
  keycloak-db:
    image: postgres:14-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  app-network:
    external: true

volumes:
  app-data:
    name: ${SERVICE_NAME:-gateway}-data-${DEPLOYMENT_ENV:-development}
  app-logs:
    name: ${SERVICE_NAME:-gateway}-logs-${DEPLOYMENT_ENV:-development}
  redis-data:
    name: redis-data-${DEPLOYMENT_ENV:-development}
  keycloak-db-data:
    name: keycloak-db-data-${DEPLOYMENT_ENV:-development}
